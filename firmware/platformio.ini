[platformio]
default_envs = pico
; Pacotes do PlatformIO ficam nesta pasta do projeto, sem caminho de outra máquina.
core_dir = .pio-core

[env:pico]
; Arduino-Pico integration documented by its maintainers.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0m
monitor_speed = 115200
monitor_eol = LF
build_flags = -Wall
